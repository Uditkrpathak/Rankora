  <!-- Upper Loop / Map Pin Head -->
  <path fill-rule="evenodd" clip-rule="evenodd" d="M15 12H26.5C31.7467 12 36 16.2533 36 21.5C36 26.7467 31.7467 31 26.5 31H15V26.5H26.5C29.2614 26.5 31.5 24.2614 31.5 21.5C31.5 18.7386 29.2614 16.5 26.5 16.5H15V12Z" fill="white" />

  <!-- Center Pin Aperture / Eye -->
