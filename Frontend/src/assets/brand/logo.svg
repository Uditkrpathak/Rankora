  <path d="M33 11C36.5 12.8 39 16 39.5 19.5" stroke="white" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round" />

  <!-- The Rankora 'R' & Location Pin Monogram -->
  <!-- Left Stem -->
