<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rankoraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3192" />
      <stop offset="100%" stop-color="#1CB5D6" />
    </linearGradient>
    <linearGradient id="pinGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1CB5D6" />
      <stop offset="100%" stop-color="#1FA971" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2E3192" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Brand Gradient -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#rankoraGrad)" filter="url(#shadow)" />

  <!-- Subtle Inner Top Highlight -->
  <rect x="2" y="2" width="44" height="22" rx="12" fill="white" fill-opacity="0.08" />

  <!-- Radar Wave Pulse (Local Map Signals) -->
